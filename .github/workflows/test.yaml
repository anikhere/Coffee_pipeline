on:
  push:
    branches: 
      - main
    paths-ignore:
      - 'README.md'

jobs:
  integration:
    name: Continious integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: repo confirm code
        run: echo "done copying repo"

  build-push-ecr-image:
    name: Continiuos delivery
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - name: Checking Out Code
        uses: actions/checkout@v3

      - name: install dependencies
        run: |
            pip install -r requirements.txt
            echo "done with download"
      - name: configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1
      
      - name: build and push ecr image
        run: |
           docker build -t ${{ secrets.ECR_LOGIN_ACCESS }}/${{ secrets.ECR_REPO_NAME }}:latest .
           docker push ${{ secrets.ECR_LOGIN_ACCESS }}/${{ secrets.ECR_REPO_NAME }}:latest
